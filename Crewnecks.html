  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>

  <script type="__bundler/template">"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=402, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#111214\">\n<meta name=\"robots\" content=\"noindex, nofollow\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<meta name=\"apple-mobile-web-app-title\" content=\"B\u0398\u03a0 Comms\">\n<link rel=\"apple-touch-icon\" href=\"https://ethanjgarson-dotcom.github.io/bthp-comms/assets/app-icon-180.png\">\n<link rel=\"manifest\" href=\"https://ethanjgarson-dotcom.github.io/bthp-comms/manifest.webmanifest\">\n<style>html,body{margin:0;background:#111214;-webkit-tap-highlight-color:transparent}#dc-root{width:402px;margin:0 auto;overflow:hidden;position:relative}@media (display-mode: standalone){html,body{overflow:hidden;overscroll-behavior:none}}<\u002Fstyle>\n<script>(function(){var E=['pointerdown','pointermove','pointerup','pointercancel','pointerleave','click'];function raw(n){for(;n&&n.getAttribute;n=n.parentNode){for(var a=n.attributes,i=0;i<a.length;i++){var k=a[i].name;if(k.charCodeAt(0)===111&&k.charCodeAt(1)===110&&a[i].value.indexOf('{{')>-1)return true}}return false}function g(e){if(raw(e.target)){e.stopImmediatePropagation();e.stopPropagation()}}E.forEach(function(t){window.addEventListener(t,g,true)});var iv=setInterval(function(){if(document.body&&!document.querySelector('[onpointerdown*=\"{{\"],[onpointermove*=\"{{\"],[onclick*=\"{{\"]')){clearInterval(iv);E.forEach(function(t){window.removeEventListener(t,g,true)})}},400)})();<\u002Fscript>\n<title>N\u00ba03 \u00b7 Crewnecks<\u002Ftitle>\n<script src=\"6800d26e-8b73-4c9d-b6bc-3db86b6a79bc\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link href=\"https://fonts.googleapis.com/css2?family=Koulen&amp;family=Space+Mono:wght@400;700&amp;family=Inter:ital,wght@0,400;0,500;0,600;1,400&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\na{color:inherit;text-decoration:none}\nbutton{font:inherit;color:inherit}\n@keyframes cardIn{0%{opacity:0;transform:scale(.94) translateY(10px)}100%{opacity:1;transform:none}}\n@keyframes capIn{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}\n@keyframes zoomIn{0%{opacity:0;transform:scale(.96)}100%{opacity:1;transform:none}}\n.card-in{animation:cardIn .7s cubic-bezier(.16,.9,.24,1) backwards}\n.cap-in{animation:capIn .7s cubic-bezier(.2,.8,.2,1) backwards}\n.zoom-in{animation:zoomIn .35s cubic-bezier(.2,.8,.2,1) backwards}\n.press{transition:transform .16s ease}\n.press:active{transform:scale(.96)}\n@keyframes dashA{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}\n@keyframes dashB{from{stroke-dashoffset:-4.5}to{stroke-dashoffset:-22.5}}\n@keyframes brkTL{0%,100%{transform:none}50%{transform:translate(-2px,-2px)}}\n@keyframes brkTR{0%,100%{transform:none}50%{transform:translate(2px,-2px)}}\n@keyframes brkBL{0%,100%{transform:none}50%{transform:translate(-2px,2px)}}\n@keyframes brkBR{0%,100%{transform:none}50%{transform:translate(2px,2px)}}\n@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}\n.dash-a{animation:dashA 3.6s steps(54) infinite}\n.dash-b{animation:dashB 3.6s steps(54) infinite}\n.brk-tl{animation:brkTL 4s ease-in-out infinite}\n.brk-tr{animation:brkTR 4s ease-in-out infinite}\n.brk-bl{animation:brkBL 4s ease-in-out infinite}\n.brk-br{animation:brkBR 4s ease-in-out infinite}\n.blink{animation:blink 2s steps(1) infinite}\n.sa-drop{margin-top:max(0px, calc(env(safe-area-inset-top) - 30px))}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width: 402px; height: 874px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #F3F4F7 0%, #E7E8EC 70%, #E1E2E7 100%); font-family: Inter, sans-serif; color: #111214;\">\n  <img src=\"https://ethanjgarson-dotcom.github.io/bthp-comms/assets/dc-bg.svg\" alt=\"\" style=\"position: absolute; left: 0; top: 0; width: 402px; height: 874px; opacity: .55;\">\n\n  <a href=\"https://ethanjgarson-dotcom.github.io/bthp-comms/DesignConcepts.html\" class=\"press\" style=\"position: absolute; left: 24px; top: max(34px, calc(env(safe-area-inset-top) + 4px)); height: 28px; display: flex; align-items: center; padding: 0 11px; background: #111214; color: #FFFFFF; border: 1px solid rgba(255,255,255,.25); font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 1.8px;\">\u2190 BACK<\u002Fa>\n  <div style=\"position: absolute; right: 24px; top: max(42px, calc(env(safe-area-inset-top) + 12px)); font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 1.6px; color: #6E7076;\">DESIGN N\u00ba03 / 06<\u002Fdiv>\n\n  <div class=\"card-in sa-drop\" style=\"position: absolute; left: 31px; top: 84px; width: 340px; height: 500px; animation-delay: .05s;\">\n    <div style=\"position: absolute; inset: 0; border-radius: 16px; padding: 12px; box-sizing: border-box; background: #FFFFFF; border: 1px solid rgba(17,18,20,.1); box-shadow: 0 18px 40px rgba(115,0,10,.22), 0 2px 8px rgba(17,18,20,.06);\">\n      <button type=\"button\" onClick=\"{{openZoom}}\" onPointerDown=\"{{pDown}}\" onPointerMove=\"{{pMove}}\" onPointerUp=\"{{pUp}}\" onPointerCancel=\"{{pUp}}\" aria-label=\"Zoom into the design (drag sideways to switch views)\" style=\"position: relative; display: block; width: 100%; height: 100%; border: 0; padding: 0; cursor: {{cursor}}; touch-action: pan-y; user-select: none; -webkit-user-select: none; border-radius: 7px; background: radial-gradient(circle at 50% 42%, rgba(115,0,10,.12), rgba(255,255,255,0) 65%), radial-gradient(rgba(17,18,20,.07) 0.7px, transparent 0.9px) 0 0 / 8px 8px, #FFFFFF; overflow: hidden;\">\n        <sc-for list=\"{{views}}\" as=\"v\" hint-placeholder-count=\"2\">\n          <img draggable=\"false\" src=\"{{v.src}}\" alt=\"{{v.alt}}\" style=\"position: absolute; left: 24px; top: 22px; width: ca iv aria-hidden=\"true\" class=\"brk-bl\" style=\"position: absolute; left: -8px; bottom: -8px; width: 14px; height: 14px; border-left: 1.3px solid rgba(17,18,20,.6); border-bottom: 1.3px solid rgba(17,18,20,.6);\"><\u002Fdiv>\n    <div aria-hidden=\"true\" class=\"brk-br\" style=\"position: absolute; right: -8px; bottom: -8px; width: 14px; height: 14px; border-right: 1.3px solid rgba(17,18,20,.6); border-bottom: 1.3px solid rgba(17,18,20,.6);\"><\u002Fdiv>\n    <div style=\"position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; background: #FFFFFF; border: 1px solid rgba(17,18,20,.45); padding: 4px 9px; font-family: 'Space Mono', monospace; font-size: 8px; letter-spacing: 1.4px; white-space: nowrap; pointer-events: none;\"><span class=\"blink\" style=\"width: 5px; height: 5px; border-radius: 50%; background: #73000A;\"><\u002Fspan>{{chip}}<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"cap-in sa-drop\" role=\"group\" aria-label=\"Choose a view\" style=\"position: absolute; left: 0; top: 604px; width: 402px; display: flex; justify-content: center; gap: 8px; animation-delay: .2s;\">\n    <sc-for list=\"{{pills}}\" as=\"p\" hint-placeholder-count=\"2\">\n      <button type=\"button\" onClick=\"{{p.pick}}\" aria-pressed=\"{{p.on}}\" style=\"min-width: 88px; height: 30px; padding: 0 12px; border: 1px solid #111214; background: {{p.bg}}; color: {{p.fg}}; font-family: 'Space Mono', monospace; font-size: 8.5px; letter-spacing: 1.6px; cursor: pointer; transition: background .25s ease, color .25s ease;\">{{p.label}}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div class=\"cap-in sa-drop\" style=\"position: absolute; left: 31px; top: 652px; width: 340px; animation-delay: .28s;\">\n    <p style=\"margin: 0; font-size: 17px; font-weight: 600; line-height: 23px; letter-spacing: -0.2px;\"><span style=\"white-space: nowrap;\">Classic College Crew \u2014 {{crewColor}}<\u002Fspan> <span style=\"font-size: 13px; font-weight: 400; font-style: italic; color: #73000A; letter-spacing: 0; white-space: nowrap; display: inline-block;\">\u00b7 Original Design<\u002Fspan><\u002Fp>\n    <p style=\"margin: 8px 0 0; font-size: 12px; font-style: italic; color: #6E7076;\">Via Fresh Prints<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"position: absolute; left: 24px; right: 24px; top: 800px; height: 1px; background: rgba(17,18,20,.12);\"><\u002Fdiv>\n  <a href=\"https://ethanjgarson-dotcom.github.io/bthp-comms/Hoodie.html\" class=\"press\" style=\"position: absolute; left: 24px; top: 816px; height: 30px; display: flex; align-items: center; padding: 0 11px; background: #FFFFFF; color: #111214; border: 1px solid #111214; font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 1.6px;\">\u2190 HOODIE<\u002Fa>\n  <a href=\"https://ethanjgarson-dotcom.github.io/bthp-comms/Polo.html\" class=\"press\" style=\"position: absolute; right: 24px; top: 816px; height: 30px; display: flex; align-items: center; padding: 0 11px; background: #111214; color: #FFFFFF; border: 1px solid rgba(255,255,255,.25); font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 1.6px;\">NEXT: POLO \u2192<\u002Fa>\n\n  <sc-if value=\"{{zoom}}\" hint-placeholder-val=\"{{false}}\">\n    <div class=\"zoom-in\" style=\"position: absolute; inset: 0; background: #F6F6F8; z-index: 10;\">\n      <div ref=\"{{zoomRef}}\" style=\"position: absolute; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch;\">\n        <div style=\"width: 760px; height: 1040px; padding: 60px; box-sizing: content-box; display: flex; align-items: center; justify-content: center;\">\n          <img src=\"{{zoomSrc}}\" alt=\"{{zoomAlt}}\" style=\"width: 760px; height: 1040px; object-fit: contain;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <button type=\"button\" onClick=\"{{closeZoom}}\" class=\"press\" style=\"position: absolute; right: 16px; top: max(34px, calc(env(safe-area-inset-top) + 4px)); height: 30px; padding: 0 12px; border: 1px solid rgba(255,255,255,.25); background: #111214; color: #FFFFFF; font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 1.6px; cursor: pointer;\">\u2715 CLOSE<\u002Fbutton>\n      <div style=\"position: absolute; left: 16px; bottom: 28px; background: rgba(255,255,255,.85); padding: 4px 7px; font-family: 'Space Mono', monospace; font-size: 8px; letter-spacing: 1.6px; color: #6E7076;\">DRAG TO LOOK AROUND<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":402,\"height\":874}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { v: 0, zoom: false, dx: 0, dragging: false };\n    this.VIEWS = [\n      { src: 'https://ethanjgarson-dotcom.github.io/bthp-comms/assets/crew-grey.webp', alt: 'Classic College Crew in heather grey', label: 'GREY' },\n      { src: 'https://ethanjgarson-dotcom.github.io/bthp-comms/assets/crew-maroon.webp', alt: 'Classic College Crew in maroon', label: 'MAROON' }\n    ];\n    this.CHIP = 'CREW \u00b7 CLASSIC BETA';\n  }\n  renderVals() {\n    const v = this.state.v, n = this.VIEWS.length, W = 316;\n    const set = (k) => this.setState({ v: k });\n    let d = this.state.dx;\n    if (n === 1) d = d * 0.25;\n    else if ((v === 0 && d > 0) || (v === n - 1 && d < 0)) d = d * 0.35;\n    const p = Math.min(Math.abs(d) / W, 1);\n    const tr = this.state.dragging ? 'none' : 'transform .55s cubic-bezier(.2,.8,.2,1), opacity .3s ease';\n    return {\n      views: this.VIEWS.map((x, k) => ({\n        src: x.src, alt: x.alt,\n        x: ((k - v) * W + d).toFixed(1),\n        s: (k === v ? 1 - p * 0.06 : 0.94 + p * 0.06).toFixed(3),\n        op: Math.abs(k - v) <= 1 ? 1 : 0,\n        tr: tr\n      })),\n      pills: n > 1 ? this.VIEWS.map((x, k) => ({ label: x.label, on: k === v, bg: k === v ? '#111214' : '#FFFFFF', fg: k === v ? '#FFFFFF' : '#111214', pick: () => set(k) })) : [],\n      multi: n > 1,\n      chip: this.CHIP,\n      crewColor: v === 0 ? 'Grey' : 'Maroon',\n      cursor: this.state.dragging ? 'grabbing' : 'grab',\n      zoom: this.state.zoom,\n      zoomSrc: this.VIEWS[v].src,\n      zoomAlt: this.VIEWS[v].alt,\n      openZoom: () => { if (this.moved) { this.moved = false; return; } this.setState({ zoom: true }); },\n      closeZoom: () => this.setState({ zoom: false }),\n      pDown: (e) => {\n        if (e.button !== undefined && e.button !== 0) return;\n        this.sx = e.clientX; this.moved = false; this.down = true;\n        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}\n      },\n      pMove: (e) => {\n        if (!this.down) return;\n        const dd = e.clientX - this.sx;\n        if (Math.abs(dd) > 5) this.moved = true;\n        if (this.moved) { cancelAnimationFrame(this.raf); this.raf = requestAnimationFrame(() => this.setState({ dx: dd, dragging: true })); }\n      },\n      pUp: (e) => {\n        if (!this.down) return;\n        this.down = false; cancelAnimationFrame(this.raf);\n        const dd = e.clientX - this.sx;\n        let nv = this.state.v;\n        if (this.moved && Math.abs(dd) > 60 && n > 1) nv = dd < 0 ? Math.min(nv + 1, n - 1) : Math.max(nv - 1, 0);\n        this.setState({ v: nv, dx: 0, dragging: false });\n      },\n      zoomRef: (el) => { if (el && !el.dataset.centred) { el.scrollLeft = (el.scrollWidth - el.clientWidth) / 2; el.scrollTop = (el.scrollHeight - el.clientHeight) / 2; el.dataset.centred = '1'; } }\n    };\n  }\n}\n<\u002Fscript>\n<\u002Fbody>\n<\u002Fhtml>\n"</script>
